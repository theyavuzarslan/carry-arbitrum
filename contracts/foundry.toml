[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

[lint]
# Lints still run with `forge lint`; they are just not printed on every build.
lint_on_build = false

[rpc_endpoints]
arbitrum = "${ARB_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
